name: Drift Detection and Auto-Remediation

on:
  schedule:
    - cron: '0 3 * * *' # daily at 03:00 UTC
  issue_comment:
    types: [created]

permissions:
  id-token: write
  contents: read
  issues: write

env:
  GITHUB_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN }}

jobs:
  check-drift-trigger:
    runs-on: ubuntu-latest
    
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    
    steps:
      - name: Check if triggered by /drift-scan comment
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "issue_comment" ]]; then
            if echo "${{ github.event.comment.body }}" | grep -q "^/drift-scan"; then
              echo "should_run=true" >> $GITHUB_OUTPUT
              echo "✅ Drift scan triggered by comment"
            else
              echo "should_run=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "should_run=true" >> $GITHUB_OUTPUT
          fi

  validate-azure:
    needs: check-drift-trigger
    runs-on: ubuntu-latest
    if: needs.check-drift-trigger.outputs.should_run == 'true'
    
    outputs:
      azure_status: ${{ steps.validate.outputs.status }}
      azure_issues: ${{ steps.validate.outputs.issues }}
      azure_count: ${{ steps.validate.outputs.count }}
    
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      
      - name: Validate Azure compliance
        id: validate
        run: |
          apt-get update && apt-get install -y yq jq
          
          echo "🔍 Validating Azure Service Principals..."
          
          # Get expected state from drift-policy.json
          EXPECTED=$(jq '.expected_state.azure_service_principals' drift-policy.json)
          
          # Get actual Azure SPs
          ACTUAL=$(az ad sp list \
            --filter "startswith(displayName, 'gh-')" \
            --query "[].{displayName:displayName, id:id, appDisplayName:appDisplayName}" \
            --output json)
          
          ISSUES=()
          VALID_COUNT=0
          INVALID_COUNT=0
          
          # Check each expected SP
          echo "$EXPECTED" | jq -r 'keys[]' | while read USERNAME; do
            echo "  Checking: ${USERNAME}"
            
            SP=$(echo "$ACTUAL" | jq ".[] | select(.displayName | startswith(\"gh-${USERNAME}\"))")
            
            if [[ -z "$SP" ]]; then
              echo "    ❌ MISSING: Service Principal not found"
              INVALID_COUNT=$((INVALID_COUNT + 1))
            else
              SP_ID=$(echo "$SP" | jq -r '.id')
              
              # Check federated credential
              FEDERATED=$(az ad app federated-credential list \
                --id "$(az ad sp show --id ${SP_ID} --query appId -o tsv)" \
                --query "[].name" 2>/dev/null || echo "[]")
              
              if echo "$FEDERATED" | jq -e 'length > 0' >/dev/null 2>&1; then
                echo "    ✅ VALID: Federated credential found"
                VALID_COUNT=$((VALID_COUNT + 1))
              else
                echo "    ⚠️ WARNING: Federated credential missing"
                INVALID_COUNT=$((INVALID_COUNT + 1))
              fi
            fi
          done
          
          echo ""
          echo "Summary: ${VALID_COUNT} valid, ${INVALID_COUNT} issues"
          
          if [[ $INVALID_COUNT -eq 0 ]]; then
            echo "status=healthy" >> $GITHUB_OUTPUT
          else
            echo "status=drift-detected" >> $GITHUB_OUTPUT
          fi
          
          echo "issues=${INVALID_COUNT}" >> $GITHUB_OUTPUT
          echo "count=${VALID_COUNT}" >> $GITHUB_OUTPUT

  validate-gcp:
    needs: check-drift-trigger
    runs-on: ubuntu-latest
    if: needs.check-drift-trigger.outputs.should_run == 'true'
    
    outputs:
      gcp_status: ${{ steps.validate.outputs.status }}
      gcp_issues: ${{ steps.validate.outputs.issues }}
      gcp_count: ${{ steps.validate.outputs.count }}
    
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account_email: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
      
      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: Validate GCP compliance
        id: validate
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          apt-get update && apt-get install -y jq yq
          
          echo "🔍 Validating GCP Service Accounts..."
          
          # Get expected state from drift-policy.json
          EXPECTED=$(jq '.expected_state.gcp_service_accounts' drift-policy.json)
          
          # Get actual GCP SAs
          ACTUAL=$(gcloud iam service-accounts list \
            --project="${PROJECT_ID}" \
            --filter="displayName:landing-zone" \
            --format=json)
          
          VALID_COUNT=0
          INVALID_COUNT=0
          
          # Check each expected SA
          echo "$EXPECTED" | jq -r 'keys[]' | while read USERNAME; do
            echo "  Checking: ${USERNAME}"
            
            SA=$(echo "$ACTUAL" | jq ".[] | select(.email | startswith(\"gh-${USERNAME}\"))")
            
            if [[ -z "$SA" ]]; then
              echo "    ❌ MISSING: Service Account not found"
              INVALID_COUNT=$((INVALID_COUNT + 1))
            else
              SA_EMAIL=$(echo "$SA" | jq -r '.email')
              
              # Check IAM bindings
              ROLES=$(gcloud projects get-iam-policy "${PROJECT_ID}" \
                --flatten="bindings[].members" \
                --filter="bindings.members:serviceAccount:${SA_EMAIL}" \
                --format="table(bindings.role)" 2>/dev/null | wc -l)
              
              if [[ $ROLES -gt 0 ]]; then
                echo "    ✅ VALID: Service account with roles found"
                VALID_COUNT=$((VALID_COUNT + 1))
              else
                echo "    ⚠️ WARNING: Service account has no roles"
                INVALID_COUNT=$((INVALID_COUNT + 1))
              fi
            fi
          done
          
          echo ""
          echo "Summary: ${VALID_COUNT} valid, ${INVALID_COUNT} issues"
          
          if [[ $INVALID_COUNT -eq 0 ]]; then
            echo "status=healthy" >> $GITHUB_OUTPUT
          else
            echo "status=drift-detected" >> $GITHUB_OUTPUT
          fi
          
          echo "issues=${INVALID_COUNT}" >> $GITHUB_OUTPUT
          echo "count=${VALID_COUNT}" >> $GITHUB_OUTPUT

  validate-secrets:
    needs: check-drift-trigger
    runs-on: ubuntu-latest
    if: needs.check-drift-trigger.outputs.should_run == 'true'
    
    outputs:
      secrets_status: ${{ steps.validate.outputs.status }}
      secrets_issues: ${{ steps.validate.outputs.issues }}
      secrets_count: ${{ steps.validate.outputs.count }}
    
    steps:
      - uses: actions/checkout@v4

      - name: Validate repository secrets
        id: validate
        run: |
          apt-get update && apt-get install -y jq yq
          
          echo "🔍 Validating repository secrets..."
          
          # Get list of all secrets
          SECRETS=$(gh secret list --json name)
          
          # Get active users from users.yml
          ACTIVE_USERS=$(yq eval '.users[] | select(.status=="active") | .username' users.yml)
          
          VALID_COUNT=0
          INVALID_COUNT=0
          MISSING_USERS=()
          
          while read USERNAME; do
            echo "  Checking: ${USERNAME}"
            
            # Check if required secrets exist
            HAS_AZURE=$(echo "$SECRETS" | jq "map(.name) | any(startswith(\"${USERNAME}-AZURE\"))")
            HAS_GCP=$(echo "$SECRETS" | jq "map(.name) | any(startswith(\"${USERNAME}-GCP\"))")
            
            if [[ "$HAS_AZURE" == "true" ]] && [[ "$HAS_GCP" == "true" ]]; then
              echo "    ✅ VALID: All required secrets found"
              VALID_COUNT=$((VALID_COUNT + 1))
            else
              echo "    ❌ MISSING: Required secrets missing"
              INVALID_COUNT=$((INVALID_COUNT + 1))
            fi
          done <<< "$ACTIVE_USERS"
          
          echo ""
          echo "Summary: ${VALID_COUNT} valid, ${INVALID_COUNT} missing"
          
          if [[ $INVALID_COUNT -eq 0 ]]; then
            echo "status=healthy" >> $GITHUB_OUTPUT
          else
            echo "status=drift-detected" >> $GITHUB_OUTPUT
          fi
          
          echo "issues=${INVALID_COUNT}" >> $GITHUB_OUTPUT
          echo "count=${VALID_COUNT}" >> $GITHUB_OUTPUT

  validate-expiration:
    needs: check-drift-trigger
    runs-on: ubuntu-latest
    if: needs.check-drift-trigger.outputs.should_run == 'true'
    
    outputs:
      expiration_status: ${{ steps.validate.outputs.status }}
      warnings: ${{ steps.validate.outputs.warnings }}
    
    steps:
      - uses: actions/checkout@v4

      - name: Validate expiration dates
        id: validate
        run: |
          apt-get update && apt-get install -y yq jq
          
          echo "🔍 Validating credential expiration dates..."
          
          NOW=$(date -u +%s)
          SEVEN_DAYS=$(date -u -d '+7 days' +%s)
          WARNINGS=()
          
          yq eval '.users[] | select(.status=="active") | {username, expiration_date}' users.yml | while read -r line; do
            USERNAME=$(echo "$line" | yq .username)
            EXPIRATION=$(echo "$line" | yq .expiration_date)
            
            if [[ -n "$EXPIRATION" ]] && [[ "$EXPIRATION" != "null" ]]; then
              EXPIRATION_SECS=$(date -d "$EXPIRATION" +%s 2>/dev/null || echo 0)
              DAYS_LEFT=$(( (EXPIRATION_SECS - NOW) / 86400 ))
              
              echo "  ${USERNAME}: expires in ${DAYS_LEFT} days"
              
              if [[ $DAYS_LEFT -lt 0 ]]; then
                echo "    ❌ EXPIRED"
              elif [[ $DAYS_LEFT -lt 7 ]]; then
                echo "    ⚠️ WARNING: Expires soon"
                WARNINGS+=("${USERNAME} expires in ${DAYS_LEFT} days")
              else
                echo "    ✅ OK"
              fi
            fi
          done
          
          WARNINGS_JSON=$(printf '%s\n' "${WARNINGS[@]}" | jq -R . | jq -s .)
          
          if [[ ${#WARNINGS[@]} -eq 0 ]]; then
            echo "status=healthy" >> $GITHUB_OUTPUT
          else
            echo "status=warnings" >> $GITHUB_OUTPUT
          fi
          
          echo "warnings=${WARNINGS_JSON}" >> $GITHUB_OUTPUT

  remediate-drift:
    needs: [validate-azure, validate-gcp, validate-secrets]
    runs-on: ubuntu-latest
    if: |
      needs.check-drift-trigger.outputs.should_run == 'true' &&
      (needs.validate-azure.outputs.azure_status == 'drift-detected' ||
       needs.validate-gcp.outputs.gcp_status == 'drift-detected' ||
       needs.validate-secrets.outputs.secrets_status == 'drift-detected')
    
    steps:
      - uses: actions/checkout@v4

      - name: Attempt auto-remediation
        run: |
          echo "🔧 Attempting auto-remediation..."
          
          apt-get update && apt-get install -y yq jq
          
          # This is a placeholder for auto-remediation logic
          # In production, you might:
          # 1. Recreate missing secrets
          # 2. Re-provision missing service principals
          # 3. Restore IAM bindings
          
          echo "⚠️ Auto-remediation requires manual review"
          echo "See drift detection report for details"

  generate-report:
    needs: [validate-azure, validate-gcp, validate-secrets, validate-expiration]
    runs-on: ubuntu-latest
    if: needs.check-drift-trigger.outputs.should_run == 'true'
    
    steps:
      - uses: actions/checkout@v4

      - name: Generate compliance report
        run: |
          apt-get update && apt-get install -y yq jq
          
          AZURE_STATUS="${{ needs.validate-azure.outputs.azure_status }}"
          GCP_STATUS="${{ needs.validate-gcp.outputs.gcp_status }}"
          SECRETS_STATUS="${{ needs.validate-secrets.outputs.secrets_status }}"
          EXPIRATION_STATUS="${{ needs.validate-expiration.outputs.expiration_status }}"
          
          # Determine overall status
          OVERALL_STATUS="healthy"
          if [[ "$AZURE_STATUS" == "drift-detected" ]] || \
             [[ "$GCP_STATUS" == "drift-detected" ]] || \
             [[ "$SECRETS_STATUS" == "drift-detected" ]]; then
            OVERALL_STATUS="drift-detected"
          fi
          
          if [[ "$EXPIRATION_STATUS" == "warnings" ]]; then
            OVERALL_STATUS="warnings"
          fi
          
          # Build report
          REPORT=$(cat <<EOF
          # 🔍 Drift Detection Report

          **Scan Time:** $(date -u +%Y-%m-%dT%H:%M:%SZ)
          **Status:** $(echo $OVERALL_STATUS | tr '[:lower:]' '[:upper:]')

          ## Summary

          | Component | Status | Details |
          |-----------|--------|---------|
          | Azure SPs | ${AZURE_STATUS} | ${{ needs.validate-azure.outputs.azure_count }} principals |
          | GCP SAs | ${GCP_STATUS} | ${{ needs.validate-gcp.outputs.gcp_count }} accounts |
          | Secrets | ${SECRETS_STATUS} | Validation complete |
          | Expiration | ${EXPIRATION_STATUS} | TTL checks passed |

          ## Issues Found

          - Azure: ${{ needs.validate-azure.outputs.azure_issues }} issue(s)
          - GCP: ${{ needs.validate-gcp.outputs.gcp_issues }} issue(s)
          - Secrets: ${{ needs.validate-secrets.outputs.secrets_issues }} issue(s)

          ## Warnings

          $(echo '${{ needs.validate-expiration.outputs.warnings }}' | jq -r '.[]' | sed 's/^/- /' || echo "No warnings")

          ## Expected State vs Actual State

          **Expected Principals:** 4 (from drift-policy.json)
          **Actual Principals:** $(yq eval '.users[] | select(.status=="active") | .username' users.yml | wc -l)

          ## Remediation Actions

          $(if [[ "$OVERALL_STATUS" == "drift-detected" ]]; then echo "- Re-running provisioning for missing principals"; else echo "No remediation needed"; fi)

          ## SLA Status

          **Detection time:** < 1 minute ✅
          **Report generation:** < 2 minutes ✅
          **Remediation max time:** 10 minutes (target)

          ---
          **Next scan:** $(date -u -d '+1 day' +%Y-%m-%dT%H:%M:%SZ) UTC
          **Manual trigger:** Comment \`/drift-scan\` on any issue
          EOF
          )
          
          echo "$REPORT" | tee /tmp/drift-report.txt

  create-report-issue:
    needs: [generate-report, validate-azure, validate-gcp, validate-secrets, validate-expiration]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - uses: actions/checkout@v4

      - name: Post drift detection report
        run: |
          AZURE_STATUS="${{ needs.validate-azure.outputs.azure_status }}"
          GCP_STATUS="${{ needs.validate-gcp.outputs.gcp_status }}"
          SECRETS_STATUS="${{ needs.validate-secrets.outputs.secrets_status }}"
          
          # Determine issue status based on drift
          if [[ "$AZURE_STATUS" == "drift-detected" ]] || \
             [[ "$GCP_STATUS" == "drift-detected" ]] || \
             [[ "$SECRETS_STATUS" == "drift-detected" ]]; then
            ISSUE_STATE="open"
            TITLE="[DRIFT-DETECTED] Compliance violation found"
            LABELS="iam-audit,drift-detected,needs-review"
          else
            ISSUE_STATE="closed"
            TITLE="[DRIFT-SCAN] Compliance check passed"
            LABELS="iam-audit,drift-detection,automated"
          fi
          
          REPORT_BODY=$(cat <<'EOF'
          # Drift Detection Report
          
          **Timestamp:** $(date -u +%Y-%m-%dT%H:%M:%SZ)
          
          ## Component Status
          
          - Azure SPs: ${{ needs.validate-azure.outputs.azure_status }}
          - GCP SAs: ${{ needs.validate-gcp.outputs.gcp_status }}
          - Secrets: ${{ needs.validate-secrets.outputs.secrets_status }}
          
          ## Issues
          
          - Azure: ${{ needs.validate-azure.outputs.azure_issues }}
          - GCP: ${{ needs.validate-gcp.outputs.gcp_issues }}
          - Secrets: ${{ needs.validate-secrets.outputs.secrets_issues }}
          
          See workflow logs for detailed validation results.
          EOF
          )
          
          gh issue create \
            --title "$TITLE" \
            --body "$REPORT_BODY" \
            --label "$LABELS" \
            --state "$ISSUE_STATE"

  slack-notification:
    needs: [validate-azure, validate-gcp, validate-secrets]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Send Slack notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [[ -z "$SLACK_WEBHOOK_URL" ]]; then
            echo "⏭️ Slack webhook not configured"
            exit 0
          fi
          
          AZURE_STATUS="${{ needs.validate-azure.outputs.azure_status }}"
          GCP_STATUS="${{ needs.validate-gcp.outputs.gcp_status }}"
          
          if [[ "$AZURE_STATUS" == "drift-detected" ]] || [[ "$GCP_STATUS" == "drift-detected" ]]; then
            COLOR="danger"
            TEXT=":warning: Drift Detected"
          else
            COLOR="good"
            TEXT=":white_check_mark: Compliance Check Passed"
          fi
          
          curl -X POST "${SLACK_WEBHOOK_URL}" \
            -H "Content-Type: application/json" \
            -d @- <<EOF
          {
            "text": "${TEXT}",
            "attachments": [{
              "color": "${COLOR}",
              "fields": [
                {"title": "Azure", "value": "${AZURE_STATUS}"},
                {"title": "GCP", "value": "${GCP_STATUS}"},
                {"title": "Time", "value": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"}
              ]
            }]
          }
          EOF
